<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GnabilaNews - Portal Berita Terkini</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar kamu tetap -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-newspaper"></i> Gnabila<span>News</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse text-center" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="nasional.html">Nasional</a></li>
          <li class="nav-item"><a class="nav-link" href="internasional.html">Internasional</a></li>
          <li class="nav-item"><a class="nav-link" href="teknologi.html">Teknologi</a></li>
          <li class="nav-item"><a class="nav-link" href="olahraga.html">Olahraga</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-5 news-section">
    <h2 class="section-title text-center mb-4">🔥 Berita Terkini</h2>
    <div class="row" id="newsContainer"></div>
  </main>

  <footer class="text-center mt-5 p-3 bg-dark text-white">
    <p>&copy; 2025 GnabilaNews</p>
  </footer>

  <script>
  async function loadNews(category = "indonesia") {
    const container = document.getElementById("newsContainer");
    container.innerHTML = "<p class='text-center'>🔥 Memuat berita...</p>";
    try {
      const res = await fetch(`/api/news?q=${category}`);
      const data = await res.json();
      container.innerHTML = data.articles.map(article => `
        <div class="col-md-4 mb-4">
          <div class="card news-card h-100">
            <img src="${article.urlToImage || 'https://via.placeholder.com/400x250'}" class="card-img-top">
            <div class="card-body">
              <h5>${article.title}</h5>
              <p>${article.description || ''}</p>
              <a href="${article.url}" target="_blank" class="btn btn-warning">Baca Selengkapnya</a>
            </div>
          </div>
        </div>`).join('');
    } catch {
      container.innerHTML = "<p class='text-center text-danger'>Gagal memuat berita.</p>";
    }
  }
  loadNews("terbaru");
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
